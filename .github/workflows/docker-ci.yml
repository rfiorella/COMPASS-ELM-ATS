name: Build Docker Image

on:
  push:
    branches:
      - '**'
jobs:
  # need to split job builds by architecture like amanzi and ats,
  # even though emulation is fast, the runners are not large enough
  # in RAM
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GHA_PAT }}
      - name: Extract the branch name
        id: branch
        working-directory: amanzi
        run: |
          AMANZI_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "AMANZI_BRANCH=$AMANZI_BRANCH" >> $GITHUB_ENV
      - name: Filter the branch name to generate a tag for Docker
        id: tag
        run:
          echo "AMANZI_BRANCH_TAG=$(echo ${{env.AMANZI_BRANCH}} | sed -e 's/\//--/g')" >> $GITHUB_ENV
      - name: Get TPLs version
        id: version
        working-directory: amanzi/Docker
        run: |
          ls *
          echo "AMANZI_TPLS_VER=$(./get_tpls_version.sh)" >> $GITHUB_ENV
      - name: Output the TPLs version
        run:
          echo "TPLs version = ${{env.AMANZI_TPLS_VER}}"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Docker/Dockerfile-ATS-ELM
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-amd64
          build-args: |
            amanzi_branch='master'
            amanzi_tpls_ver=${{env.AMANZI_TPLS_VER}}
            ats_branch='master'
  test-elmats:
    needs: build
    name: ELM-ATS single column
    runs-on: ubuntu-latest
    container:
      image: metsi/compass-elm-ats:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: deal with weird HOME issue
        run: |
          echo HOME=/home/amanzi_user >> "$GITHUB_ENV"
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHA_PAT }}
      - name: run test case
        run: |
          export E3SM_WORK_DIR=/home/amanzi_user/work
          export ELM_ATS_SRC_DIR=/home/amanzi_user/E3SM
          export MACHINE_NAME=docker-ats
          export COMPILER_NAME=gnu
          . $(find / -path '*/oakharbor_column/build_example.sh')
  test-elmonly:
    needs: build
    name: ELM only single column
    runs-on: ubuntu-latest
    container:
      image: metsi/compass-elm-ats:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: deal with weird HOME issue
        run: |
          echo HOME=/home/amanzi_user >> "$GITHUB_ENV"
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHA_PAT }}
      - name: run test case
        run: |
          export E3SM_WORK_DIR=/home/amanzi_user/work
          export ELM_ATS_SRC_DIR=/home/amanzi_user/E3SM
          export MACHINE_NAME=docker-ats
          export COMPILER_NAME=gnu
          . $(find / -path '*/oakharbor_elmonly/build_example.sh')
  serial-transect:
    needs: build
    name: Serial transect
    runs-on: ubuntu-latest
    container:
      image: metsi/compass-elm-ats:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: deal with weird HOME issue
        run: |
          echo HOME=/home/amanzi_user >> "$GITHUB_ENV"
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHA_PAT }}
      - name: run test case
        run: |
          export E3SM_WORK_DIR=/home/amanzi_user/work
          export ELM_ATS_SRC_DIR=/home/amanzi_user/E3SM
          export MACHINE_NAME=docker-ats
          export COMPILER_NAME=gnu
          . $(find / -path '*/tempest_transect/build_serial.sh')
  parallel-transect:
    needs: build
    name: Parallel transect
    runs-on: ubuntu-latest
    container:
      image: metsi/compass-elm-ats:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: deal with weird HOME issue
        run: |
          echo HOME=/home/amanzi_user >> "$GITHUB_ENV"
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHA_PAT }}
      - name: run test case
        run: |
          export E3SM_WORK_DIR=/home/amanzi_user/work
          export ELM_ATS_SRC_DIR=/home/amanzi_user/E3SM
          export MACHINE_NAME=docker-ats
          export COMPILER_NAME=gnu
          . $(find / -path '*/tempest_transect/build_parallel.sh')
