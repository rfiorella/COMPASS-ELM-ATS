name: Build Docker Image

on:
  push:
    branches:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GHA_PAT }}
      - name: Checkout amanzi repository
        run: |
          git clone https://github.com/amanzi/amanzi
      - name: Extract the branch name
        id: branch
        working-directory: amanzi
        run: |
          AMANZI_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "AMANZI_BRANCH=$AMANZI_BRANCH" >> $GITHUB_ENV
      - name: Filter the branch name to generate a tag for Docker
        id: tag
        run:
          echo "AMANZI_BRANCH_TAG=$(echo ${{env.AMANZI_BRANCH}} | sed -e 's/\//--/g')" >> $GITHUB_ENV
      - name: Get TPLs version
        id: version
        working-directory: amanzi/Docker
        run: |
          ls *
          echo "AMANZI_TPLS_VER=$(./get_tpls_version.sh)" >> $GITHUB_ENV
      - name: Output the TPLs version
        run:
          echo "TPLs version = ${{env.AMANZI_TPLS_VER}}"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build Docker image
        run: docker build --push --build-arg amanzi_branch='master' --build-arg amanzi_tpls_ver=${{env.AMANZI_TPLS_VER}} --build-arg ats_branch='master' --file Docker/Dockerfile-ATS-ELM-alt --tag ${{ secrets.DOCKERHUB_USERNAME }}/compass-elm-ats:latest .
  test:
    needs: build
    name: Run ELM test
    runs-on: ubuntu-latest
    container:
      image: metsi/compass-elm-ats-master:latest
    steps: 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: setup input datafiles
        run: |
          git clone https://github.com/rfiorella/pt-e3sm-inputdata /home/amanzi_user/inputdata
          cd /home/amanzi_user/inputdata/lnd/clm2/firedata
          tar -zxvf clmforc.Li_2012_hdm_0.5x0.5_AVHRR_simyr1850-2010_c130401.nc.tar.gz
          cd /home/amanzi_user/inpudtdata/atm/datm7/NASA_LIS/
          tar -zxvf clmforc.Li_2012_climo1995-2011.T62.lnfm_c130327.nc.tar.gz
          tar -zxvf clmforc.Li_2012_climo1995-2011.T62.lnfm_Total_c140423.nc.tar.gz
      - name: run test case
        run: |
          cd E3SM/cime/scripts && ./create_newcase --mach docker-ats --res ELM_USRDAT --compset ICB1850CNPRDCTCBC --case ~/output/ci_test \
          && cd ~/work/output/ci_test
          ./xmlchange MOSART_MODE=NULL,DOUT_S=FALSE,DIN_LOC_ROOT=/home/amanzi_user/inputdata
          ./xmlchange DIN_LOC_ROOT_CLMFORC=/home/amanzi_user/inputdata/atm/datm7
          ./xmlchange ELM_USRDAT_NAME=1x1pt_AK-TLG
          ./xmlchange ATM_DOMAIN_PATH=/home/amanzi_user/inputdata/share/domains/domain.clm
          ./xmlchange LND_DOMAIN_PATH=/home/amanzi_user/inputdata/share/domains/domain.clm
          ./xmlchange ATM_DOMAIN_FILE=domain.lnd.1x1pt_teller-GRID_navy.nc
          ./xmlchange LND_DOMAIN_FILE=domain.lnd.1x1pt_teller-GRID_navy.nc
          ./xmlchange PIO_TYPENAME=netcdf,NTASKS=1,NTHRDS=1
          ./xmlchange STOP_OPTION=nyears,STOP_N=5
          ./xmlchange BATCH_SYSTEM=none
          echo "&clm_inparm" >> user_nl_elm
          echo " do_budgets = .false." >> user_nl_elm
          echo " use_nofire = .true." >> user_nl_elm
          echo " metdata_type = 'gswp3'" >> user_nl_elm
          echo " metdata_bypass = '/home/amanzi_user/inputdata/atm/datm7/atm_forcing.datm7.GSWP3.0.5d.v2.c180716_NGEE-Grid/cpl_bypass_teller-Grid'" >> user_nl_elm
          echo " fsurdat = '/home/amanzi_user/inputdata/lnd/clm2/surfdata_map/surfdata_1x1pt_teller-GRID_simyr1850_c360x720_c171002.nc'" >> user_nl_elm
          echo " stream_fldfilename_popdens = '/home/amanzi_user/inputdata/lnd/clm2/firedata/clmforc.Li_2012_hdm_0.5x0.5_AVHRR_simyr1850-2010_c130401.nc'" >> user_nl_elm
          ./case.setup
          # add coupler bypass flag to cmake macros.
          # echo 'string(APPEND CPPDEFS " -DCPL_BYPASS")' >> cmake_macros/universal.cmake
          ./case.build || cat /home/amanzi_user/output/ci_test/bld/e3sm.bldlog.*
          ./case.submit --no-batch
          cat /home/amanzi_user/output/ci_test/run/e3sm.log.*
          cat /home/amanzi_user/output/ci_test/run/lnd.log.*
